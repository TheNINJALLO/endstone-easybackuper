[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-easybackuper"
version = "0.3.1"
description = "The simplest Python hot backup plugin based on EndStone."
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.8,<0.12"
]

[project.entry-points."endstone"]
easybackuper = "endstone_easybackuper:EasyBackuperPlugin"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["endstone_easybackuper"]

[tool.setuptools.package-data]
"endstone_easybackuper" = ["*.yml", "*.json", "*.toml"]
